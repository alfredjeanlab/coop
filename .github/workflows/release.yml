name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tarball: coop-linux-x86_64.tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            tarball: coop-linux-aarch64.tar.gz
          - runner: macos-latest
            target: x86_64-apple-darwin
            tarball: coop-macos-x86_64.tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            tarball: coop-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools

      - name: Install aarch64 musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz | tar xz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p coop -p coopmux

      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/coop staging/
          cp target/${{ matrix.target }}/release/coopmux staging/
          tar -czf ${{ matrix.tarball }} -C staging coop coopmux

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tarball }}
          path: ${{ matrix.tarball }}

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

      - name: Copy install script
        run: cp scripts/install.sh artifacts/install.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/install.sh

  docker:
    name: Docker (${{ matrix.name }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: empty
            target: empty
          - name: claude
            target: claude
          - name: gemini
            target: gemini
          - name: coopmux
            target: coopmux
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alfredjeanlab/coop
          tags: |
            type=match,pattern=v(.*),group=1,suffix=-${{ matrix.name }}
            type=raw,value=${{ matrix.name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
