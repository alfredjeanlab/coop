name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/alfredjeanlab/coop

jobs:
  docker:
    name: Docker (${{ matrix.target }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        target: [empty, claude, gemini, coopmux]
        arch: ${{ github.event_name == 'push' && fromJSON('["amd64","arm64"]') || fromJSON('["amd64"]') }}
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly-${{ matrix.target }}-${{ matrix.arch }},enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,suffix=-${{ matrix.target }}-${{ matrix.arch }}
            type=raw,value=${{ matrix.target }}-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.target == 'empty' }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}-${{ matrix.arch }}

      - name: Build image (PR)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: coop:${{ matrix.target }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}-${{ matrix.arch }}

      - name: Smoke test
        if: github.event_name != 'push'
        run: docker run --rm coop:${{ matrix.target }} --help

  manifest:
    name: Manifest (${{ matrix.target }})
    needs: [docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [empty, claude, gemini, coopmux]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly-${{ matrix.target }},enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,suffix=-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.target == 'empty' }}

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "::group::$TAG"
            docker buildx imagetools create \
              -t "$TAG" \
              "${TAG}-amd64" \
              "${TAG}-arm64"
            echo "::endgroup::"
          done <<< "${{ steps.meta.outputs.tags }}"

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: claudeless
          push: false
          load: true
          tags: coop:test
          cache-from: type=gha,scope=docker-claudeless-amd64
          cache-to: type=gha,mode=max,scope=docker-claudeless-amd64
      - name: Run Docker E2E tests
        run: COOP_DOCKER_TESTS=1 cargo test --test docker_e2e -- --test-threads=1
