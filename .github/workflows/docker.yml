name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/alfredjeanlab/coop

jobs:
  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: empty
            target: empty
            scope: docker-empty
          - name: claude
            target: claude
            scope: docker-claude
          - name: gemini
            target: gemini
            scope: docker-gemini
          - name: coopmux
            target: coopmux
            scope: docker-coopmux
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=nightly-${{ matrix.name }},enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,suffix=-${{ matrix.name }}
            type=raw,value=${{ matrix.name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Build image (PR)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: coop:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Smoke test
        if: github.event_name != 'push'
        run: docker run --rm coop:${{ matrix.name }} --help

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: claudeless
          push: false
          load: true
          tags: coop:test
          cache-from: type=gha,scope=docker-claudeless
          cache-to: type=gha,mode=max,scope=docker-claudeless
      - name: Run Docker E2E tests
        run: COOP_DOCKER_TESTS=1 cargo test --test docker_e2e -- --test-threads=1
